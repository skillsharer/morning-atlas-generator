
name: Morning Atlas Daily Drive to Kindle

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Edition date (YYYY-MM-DD), blank for today"
        required: false
        type: string

  schedule:
    # 07:00 Budapest, including daylight saving time
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: morning-atlas-daily-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine edition date
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.edition_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, date
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          scheduled = os.environ["EVENT_NAME"] == "schedule"

          if scheduled and now.hour != 7:
              print("Skipping non-07:00 Budapest schedule.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("ready=false\n")
          else:
              day = os.environ.get("INPUT_DATE") or now.date().isoformat()
              date.fromisoformat(day)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"ready=true\ndate={day}\n")
              print(f"Edition: {day}")
          PY

      - name: Install dependencies
        if: steps.edition.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            reportlab pymupdf google-auth requests

      - name: Wait for latest valid dated Drive JSON
        if: steps.edition.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MORNING_ATLAS_FOLDER_ID: "1vZQgVDBklcs9G4Wxj9l3dZ0KPiQrSMm9"
          EDITION_DATE: ${{ steps.edition.outputs.date }}
        run: |
          for attempt in $(seq 1 10); do
            if python scripts/fetch_latest_drive_json.py \
              --date "$EDITION_DATE" \
              --output manuscript.json; then
              echo "Valid manuscript received."
              exit 0
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "No valid manuscript. Email cancelled."
              exit 1
            fi

            echo "Waiting 5 minutes before retry..."
            sleep 300
          done

      - name: Generate and verify PDF
        if: steps.edition.outputs.ready == 'true'
        run: |
          python morning_atlas_pdf.py manuscript.json \
            --out-dir editions --verify

      - name: Save PDF artifact
        if: steps.edition.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morning-atlas-${{ steps.edition.outputs.date }}
          path: |
            editions/Morning_Atlas_${{ steps.edition.outputs.date }}.pdf
            editions/Morning_Atlas_${{ steps.edition.outputs.date }}.md
          if-no-files-found: error
          retention-days: 14

      - name: Email PDF to Kindle
        if: steps.edition.outputs.ready == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          EDITION_DATE: ${{ steps.edition.outputs.date }}
        run: |
          python scripts/send_kindle_pdf.py \
            --pdf "editions/Morning_Atlas_${EDITION_DATE}.pdf"
